<svg xmlns='http://www.w3.org/2000/svg' width='940' height='430' viewBox='0 0 940 430'><rect width='940' height='430' fill='#ffffff'/><text x='24' y='34' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='17' fill='#111827' text-anchor='start' font-weight='600'>同一张图、单帧推理，谁快谁慢（对数刻度）</text><text x='24' y='56' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='11.5' fill='#6b7280' text-anchor='start' font-weight='400'>YOLO n 级 / 640 / 不含前后处理；K3 为本次实测，其余为 Ultralytics 官方 benchmark（YOLO26n）</text><line x1='300.0' y1='78' x2='300.0' y2='356' stroke='#e5e7eb' stroke-width='1'/><text x='300.0' y='374' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='11' fill='#9ca3af' text-anchor='middle' font-weight='400'>1 ms</text><line x1='466.9' y1='78' x2='466.9' y2='356' stroke='#e5e7eb' stroke-width='1'/><text x='466.87177942033696' y='374' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='11' fill='#9ca3af' text-anchor='middle' font-weight='400'>10 ms</text><line x1='633.7' y1='78' x2='633.7' y2='356' stroke='#e5e7eb' stroke-width='1'/><text x='633.7435588406739' y='374' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='11' fill='#9ca3af' text-anchor='middle' font-weight='400'>100 ms</text><line x1='800.6' y1='78' x2='800.6' y2='356' stroke='#e5e7eb' stroke-width='1'/><text x='800.615338261011' y='374' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='11' fill='#9ca3af' text-anchor='middle' font-weight='400'>1000 ms</text><rect x='300' y='93.3' width='60.4' height='17.9' rx='5' fill='#8b5cf6' opacity='0.9'/><text x='288' y='105.83771428571428' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='12' fill='#374151' text-anchor='end' font-weight='400'>AGX Orin 64G · TensorRT INT8</text><text x='370.36216766212357' y='105.83771428571428' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='12.5' fill='#111827' text-anchor='start' font-weight='600'>2.3 ms</text><rect x='300' y='132.2' width='90.6' height='17.9' rx='5' fill='#8b5cf6' opacity='0.9'/><text x='288' y='144.69485714285713' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='12' fill='#374151' text-anchor='end' font-weight='400'>Orin NX 16G · TensorRT INT8</text><text x='400.5822449112825' y='144.69485714285713' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='12.5' fill='#111827' text-anchor='start' font-weight='600'>3.5 ms</text><rect x='300' y='171.0' width='96.7' height='17.9' rx='5' fill='#8b5cf6' opacity='0.9'/><text x='288' y='183.55200000000002' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='12' fill='#374151' text-anchor='end' font-weight='400'>Orin Nano Super · TensorRT INT8</text><text x='406.74952044617' y='183.55200000000002' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='12.5' fill='#111827' text-anchor='start' font-weight='600'>3.8 ms</text><rect x='300' y='209.9' width='195.3' height='17.9' rx='5' fill='#16a34a' opacity='0.9'/><text x='288' y='222.40914285714285' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='12' fill='#374151' text-anchor='end' font-weight='400'>K3 · SpaceMIT EP int8（本机实测）</text><text x='505.2836548354525' y='222.40914285714285' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='12.5' fill='#111827' text-anchor='start' font-weight='600'>14.8 ms</text><rect x='300' y='248.8' width='304.8' height='17.9' rx='5' fill='#2563eb' opacity='0.9'/><text x='288' y='261.2662857142857' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='12' fill='#374151' text-anchor='end' font-weight='400'>树莓派 5 · NCNN（CPU）</text><text x='614.7527943408209' y='261.2662857142857' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='12.5' fill='#111827' text-anchor='start' font-weight='600'>67.0 ms</text><rect x='300' y='287.6' width='350.5' height='17.9' rx='5' fill='#2563eb' opacity='0.9'/><text x='288' y='300.1234285714286' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='12' fill='#374151' text-anchor='end' font-weight='400'>树莓派 5 · ONNX Runtime（CPU）</text><text x='660.4868183717838' y='300.1234285714286' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='12.5' fill='#111827' text-anchor='start' font-weight='600'>126 ms</text><rect x='300' y='326.5' width='487.3' height='17.9' rx='5' fill='#f59e0b' opacity='0.9'/><text x='288' y='338.9805714285714' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='12' fill='#374151' text-anchor='end' font-weight='400'>K3 · ONNX Runtime CPU（本机实测）</text><text x='797.2861755849665' y='338.9805714285714' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='12.5' fill='#111827' text-anchor='start' font-weight='600'>832 ms</text><line x1='300' y1='84' x2='300' y2='356' stroke='#9ca3af' stroke-width='1'/><text x='24' y='396' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='12' fill='#111827' text-anchor='start' font-weight='400'>K3 的加速路径比树莓派 5 最快的 CPU 路径快 4.5×；但同一块板换回通用 ONNX，反而比树莓派 5 慢 6.6×。</text><text x='24' y='416' font-family='-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif' font-size='11.5' fill='#6b7280' text-anchor='start' font-weight='400'>差的不是算力，是算子库：RISC-V 上的 ONNX Runtime 还没人优化，IME 的 int8 内核只有厂方 EP 有。</text></svg>